# Copy to .github/workflows/a11y.yml in a site repo, next to an a11y.config.json.
# Scans production after every production deploy, after content is published
# (via a Sanity webhook, debounced: one scan once publishing goes quiet for
# A11Y_PUBLISH_DELAY seconds, default 300), and weekly. Preview deployments are
# not scanned. Results go to an "Accessibility status" issue in this repo; when
# something changes, a comment @mentions the people in the A11Y_MENTIONS
# variable. Never blocks a deploy.
name: a11y

on:
  deployment_status:
  repository_dispatch:
    types: [content-published]
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write # the scan posts to this repo's "Accessibility status" issue

# Publishes share one group, so each new publish cancels the run still waiting
# from the previous one: the scan happens once, after the last publish in a
# session. Every other event gets its own group and is unaffected.
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'a11y-content-publish' || format('a11y-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  decide:
    # Deploys: only a finished, successful production deployment. Vercel also
    # reports previews and in-progress states; those runs show as skipped.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      trigger: ${{ steps.d.outputs.trigger }}
    steps:
      - name: Wait for publishing to go quiet
        if: github.event_name == 'repository_dispatch'
        env:
          DELAY: ${{ vars.A11Y_PUBLISH_DELAY || '300' }}
        run: sleep "$DELAY"

      - id: d
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            deployment_status) trigger=deploy ;;
            repository_dispatch) trigger=content ;;
            schedule) trigger=schedule ;;
            *) trigger=manual ;;
          esac
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"

  scan:
    needs: decide
    # A burst of deploys only needs the latest scan.
    concurrency:
      group: a11y-production
      cancel-in-progress: true
    uses: geletkaplus/a11y-monitor/.github/workflows/scan.yml@v1
    with:
      trigger: ${{ needs.decide.outputs.trigger }}
    secrets: inherit
